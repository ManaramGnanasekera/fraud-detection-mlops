# Continuous integration: lint and run every test on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused as the first stage of the deploy workflow

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-java@v4 # PySpark needs Java for the feature tests
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff boto3

      - name: Lint
        run: ruff check src tests deploy agent

      - name: Unit tests (features, inference handler, agent)
        run: pytest -v
