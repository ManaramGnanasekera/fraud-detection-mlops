[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]  # Databricks notebooks use runtime globals such as spark and display

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["fraud", "delete_endpoint"]
